name: Build and publish Pingu

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Windows build tools
        shell: powershell
        run: |
          choco install mingw innosetup --no-progress -y
          $gcc = Get-ChildItem C:\ProgramData\chocolatey -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw 'gcc.exe não foi encontrado após instalar o MinGW.' }
          Add-Content $env:GITHUB_PATH (Split-Path $gcc.FullName)

      - name: Build application and installer
        shell: powershell
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          .\scripts\build-release.ps1 -Version $version

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pingu-Windows-x64
          path: |
            dist/Pingu-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Pingu-Setup-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Pingu-Setup-*.exe dist/SHA256SUMS.txt --verify-tag --generate-notes --title "Pingu ${{ github.ref_name }}"
