name: Build and publish Pingu

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 3.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
          
      - name: Install Windows build tools
        shell: powershell
        run: |
          choco install mingw innosetup --no-progress -y

          $mingwCandidates = @(
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\ProgramData\mingw64\bin',
            'C:\tools\mingw64\bin'
          )

          $mingwBin = $mingwCandidates |
            Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1

          if (-not $mingwBin) {
            $gcc = Get-ChildItem 'C:\ProgramData\mingw64', 'C:\tools' `
              -Filter gcc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($gcc) {
              $mingwBin = $gcc.DirectoryName
            }
          }

          if (-not $mingwBin) {
            throw 'gcc.exe was not found after installing MinGW.'
          }

          $env:Path = "$mingwBin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin

          gcc.exe --version
          objdump.exe --version
          
      - name: Build application and installer
        shell: powershell
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          .\scripts\build-release.ps1 -Version $version

      - name: Verify static MinGW runtime linkage
        shell: powershell
        run: |
          $imports = (& objdump.exe -p .\dist\app\pingu.exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "objdump.exe returned exit code $LASTEXITCODE." }
          $forbidden = @(
            'libmcfgthread-2.dll',
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'libssp-0.dll',
            'libgomp-1.dll',
            'libquadmath-0.dll'
          )
          foreach ($library in $forbidden) {
            if ($imports -match [regex]::Escape($library)) {
              throw "pingu.exe still imports $library."
            }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pingu-Windows-x64
          path: |
            dist/Pingu-Setup-*.exe
            dist/Pingu-Portable-*.zip
            dist/SHA256SUMS.txt

      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/Pingu-Setup-*.exe
            dist/Pingu-Portable-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/Pingu-Setup-*.exe `
            dist/Pingu-Portable-*.zip `
            dist/SHA256SUMS.txt `
            --verify-tag `
            --generate-notes `
            --title "Pingu ${{ github.ref_name }}"
